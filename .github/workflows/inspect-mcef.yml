name: Inspect MCEF
on:
  push:
    paths: ['.github/workflows/inspect-mcef.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Download mcef-modern for 1.21.11
        run: |
          curl -s 'https://api.modrinth.com/v2/project/mcef-modern/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' -o v.json
          python3 - <<'PY'
          import json
          v=json.load(open('v.json'))
          for x in v[:3]: print(x['version_number'], x['id'], [f['filename'] for f in x['files']])
          f=v[0]['files'][0]
          open('url.txt','w').write(f['url'])
          PY
          curl -sL "$(cat url.txt)" -o mcef.jar
          ls -la mcef.jar
      - name: API
        run: |
          mkdir x && cd x && unzip -q ../mcef.jar
          mkdir j && cd j && for f in ../META-INF/jars/jcef-api*.jar; do unzip -qo $f; done && cd ..
          for c in $(find net/dimaskama/mcef/api -name '*.class'); do n=$(echo $c | sed 's|\.class$||; s|/|.|g'); echo "=== $n"; javap -public -cp . "$n"; done
          echo "=== CefBrowser/CefClient"; javap -public -cp j org.cef.browser.CefBrowser | grep -iE "audio|mute|loadURL|executeJavaScript|close|setFocus|wasResized|getURL|volume"
          javap -public -cp j org.cef.CefClient | grep -iE "audio|addDisplayHandler|addLoadHandler"
          echo "=== MCEFBrowserImpl"; javap -public -cp .:j net.dimaskama.mcef.impl.MCEFBrowserImpl
          ls j/org/cef/handler | grep -i audio
